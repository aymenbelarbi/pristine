version: '3.8'

services:
  pristine:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PRISTINE_LOG_LEVEL=info
      - PRISTINE_CACHE_DIR=/app/cache
    volumes:
      - pristine-cache:/app/cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  pristine-cache:
